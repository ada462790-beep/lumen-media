# Lumen für Windows bauen: Programm, Selbsttest, Installer.
#
# Läuft bei jeder Änderung unter desktop/windows/ (auch auf Arbeitszweigen:
# Ohne Windows-Rechner ist das hier die einzige Stelle, an der die App
# wirklich startet) und von Hand. Der Installer liegt danach als Artefakt
# am Lauf — zum Ausprobieren ohne Veröffentlichung.
#
# release.yml ruft denselben Ablauf mit einer Fassungsnummer auf und hängt
# den Installer an die Veröffentlichung (workflow_call).
#
# Was entsteht:
#   Lumen-Setup-<fassung>-windows-x64.exe   Installer (NSIS) mit libmpv, Artefakt lumen-windows-app
#   selbsttest-windows                      Bilder und Protokoll des Selbsttests
#
# Der eigene Player braucht libmpv-2.dll (mpv, GPL-3.0-or-later). Sie ist
# selbst gebaut (libmpv.yml, feste Quellen in desktop/windows/mpv/bau/),
# kommt fest gepinnt mit Prüfsumme von einer eigenen Vorab-Veröffentlichung
# oder einem libmpv-Lauf (desktop/windows/mpv/libmpv.txt) und liegt nie im
# Repository.

name: Windows-App

on:
  # Nur Zweige: Bei einem Versions-Tag baut release.yml die App ohnehin
  # (über workflow_call), ein zweiter Lauf wäre doppelt.
  push:
    branches: ['**']
    paths:
      - 'desktop/windows/**'
      - '!desktop/windows/mpv/bau/**'
      - 'server/cmd/lumen/web/**'
      - '.github/workflows/desktop.yml'
      - 'DRITTSOFTWARE.md'
      - 'THIRD_PARTY.md'
  pull_request:
    paths:
      - 'desktop/windows/**'
      - 'server/cmd/lumen/web/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Fassung für den Dateinamen, etwa v0.4.0 — leer = dev. Veröffentlicht wird hier nichts.'
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''

# Nur lesen. Der Installer wandert als Artefakt weiter; an die
# Veröffentlichung hängt ihn release.yml. actions: read, damit laden.sh das
# libmpv-Artefakt eines anderen Laufs holen darf (Arbeitszweige).
permissions:
  contents: read
  actions: read

jobs:
  windows:
    name: Windows — bauen, Selbsttest, Installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop/windows
    steps:
      # Git für Windows macht sonst aus jedem Zeilenende CRLF — gofmt hielte
      # dann jede Datei für unformatiert, und die eingebauten Seiten wären
      # nicht mehr dieselben wie im Repository.
      - name: Zeilenenden wie im Repository
        run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache-dependency-path: desktop/windows/go.sum

      # Die Fassung nur über die Umgebung, nie als Ausdruck im Skript —
      # sonst liesse sich über die Eingabe Code einschleusen.
      - name: Fassung
        env:
          EINGABE: ${{ inputs.version }}
        run: |
          V="$EINGABE"
          if [ -z "$V" ]; then
            echo "FASSUNG=dev" >> "$GITHUB_ENV"
            echo "ZAHL=0.0.0" >> "$GITHUB_ENV"
            echo "DATEI=Lumen-Setup-dev-windows-x64.exe" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! printf '%s' "$V" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Die Fassung muss so aussehen: v1.2.3"
            exit 1
          fi
          echo "FASSUNG=${V#v}" >> "$GITHUB_ENV"
          echo "ZAHL=${V#v}" >> "$GITHUB_ENV"
          echo "DATEI=Lumen-Setup-${V#v}-windows-x64.exe" >> "$GITHUB_ENV"

      - name: Formatierung
        run: |
          f=$(gofmt -l . || true)
          if [ -n "$f" ]; then echo "Nicht formatiert:"; echo "$f"; exit 1; fi

      - name: Prüfen und testen
        run: |
          go vet ./...
          go test ./...

      # Symbol, Manifest und Versionsangaben für die .exe, das Symbol für
      # den Installer — beides aus seite/symbol.png.
      - name: Ressourcen
        run: go run ./werkzeuge/ressourcen -version "$ZAHL"

      - name: Bauen
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$FASSUNG" -o dist/Lumen.exe .
          ls -l dist

      # Der eigene Player (player_windows.go): libmpv-2.dll neben Lumen.exe.
      # Für eine Veröffentlichung muss sie als eigene Vorab-Veröffentlichung
      # libmpv-* gepinnt sein (STRENG).
      - name: libmpv
        env:
          GH_TOKEN: ${{ github.token }}
          STRENG: ${{ inputs.version != '' && '1' || '0' }}
        run: bash mpv/laden.sh dist

      # Ein kleiner Testfilm für den eigenen Player: MKV mit HEVC 10 Bit,
      # AC3 5.1 (de) und AC3 Stereo (en), zwei ASS-Untertitel (de, en) —
      # genau das, was der Browser-Player nicht direkt kann.
      - name: Testfilm
        run: |
          choco install ffmpeg -y --no-progress > /dev/null
          mkdir -p testfilm
          for s in de en; do
            {
              printf '[Script Info]\nScriptType: v4.00+\nPlayResX: 1280\nPlayResY: 720\n\n'
              printf '[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, OutlineColour, BackColour, Bold, Italic, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV\n'
              printf 'Style: Default,Arial,48,&H00FFFFFF,&H00000000,&H80000000,1,0,1,3,0,2,40,40,60\n\n'
              printf '[Events]\nFormat: Layer, Start, End, Style, Text\n'
              for i in $(seq 0 2 58); do
                if [ "$s" = de ]; then t="Deutscher Untertitel $((i / 2 + 1))"; else t="English subtitle $((i / 2 + 1))"; fi
                printf 'Dialogue: 0,0:00:%02d.00,0:00:%02d.80,Default,%s\n' "$i" "$((i + 1))" "$t"
              done
            } > "testfilm/$s.ass"
          done
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=1280x720:rate=25:duration=60" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=60" \
            -f lavfi -i "sine=frequency=660:sample_rate=48000:duration=60" \
            -i testfilm/de.ass -i testfilm/en.ass \
            -map 0:v -map 1:a -map 2:a -map 3 -map 4 \
            -c:v libx265 -preset ultrafast -pix_fmt yuv420p10le -x265-params log-level=error \
            -c:a ac3 -b:a 192k -filter:a:0 "aformat=channel_layouts=5.1" -ac:a:1 2 -c:s ass \
            -metadata:s:a:0 language=ger -metadata:s:a:1 language=eng \
            -metadata:s:s:0 language=ger -metadata:s:s:1 language=eng \
            testfilm/testfilm.mkv
          ffprobe -hide_banner -v error -show_entries stream=index,codec_name,pix_fmt,channels:stream_tags=language -of compact testfilm/testfilm.mkv
          ls -l testfilm

      # Ohne Audiogerät spielt mpv stumm, und niemand sieht, welchem Prozess
      # die Audio-Sitzung gehört. Darum ein virtuelles Gerät (Scream, ein
      # signierter Treiber) — wenn es nicht klappt, prüft der Selbsttest den
      # Ton eben nicht.
      - name: Virtuelles Audiogerät
        continue-on-error: true
        timeout-minutes: 4
        shell: pwsh
        run: |
          Set-Service -Name Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name Audiosrv -ErrorAction SilentlyContinue
          $zip = "$env:RUNNER_TEMP\scream.zip"; $ordner = "$env:RUNNER_TEMP\scream"
          Invoke-WebRequest -Uri 'https://github.com/duncanthrax/scream/releases/download/3.6/Scream3.6.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $ordner -Force
          # 64 Bit, wo es eigens eines gibt; sonst, was da ist.
          $finde = { param($muster) $a = @(Get-ChildItem -Recurse $ordner -Filter $muster); ($a | Where-Object { $_.FullName -match 'x64|amd64' } | Select-Object -First 1) ?? ($a | Select-Object -First 1) }
          $inf = & $finde 'Scream.inf'; $sys = & $finde 'Scream.sys'; $devcon = & $finde 'devcon*.exe'
          Get-ChildItem -Recurse $ordner -File | ForEach-Object { $_.FullName } | Out-Host
          if (-not $inf -or -not $sys -or -not $devcon) { throw 'Scream: Dateien nicht gefunden' }
          $cert = (Get-AuthenticodeSignature $sys.FullName).SignerCertificate
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('TrustedPublisher', 'LocalMachine')
          $store.Open('ReadWrite'); $store.Add($cert); $store.Close()
          Push-Location $inf.DirectoryName
          & $devcon.FullName install $inf.FullName '*Scream'
          Pop-Location
          Start-Sleep -Seconds 5
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status

      # Die App wirklich starten: Fenster, WebView2, eingebaute Seite,
      # Server hinzufügen, die echte Web-App (von einem Schein-Server, der
      # server/cmd/lumen/web ausliefert) mit „Server wechseln", Brücke,
      # externe Links, F11 und Player-Vollbild, der eigene Player (mpv mit
      # dem Testfilm: Bild, Zeit, Spuren, Fortschritt, Esc, Audio-Sitzung,
      # Mediensteuerung von Windows, Hardware-Beschleunigung),
      # Serverauswahl. Die Bilder liegen danach am Lauf (selbsttest-windows).
      - name: Selbsttest
        timeout-minutes: 10
        shell: pwsh
        run: |
          $web = (Resolve-Path ..\..\server\cmd\lumen\web).Path
          $film = (Resolve-Path testfilm\testfilm.mkv).Path
          $p = Start-Process -FilePath dist\Lumen.exe -ArgumentList '--selbsttest', "$PWD\selbsttest", '--selbsttest-web', $web, '--selbsttest-film', $film -PassThru -Wait
          Get-Content selbsttest\protokoll.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            Get-Content selbsttest\lumen.log -ErrorAction SilentlyContinue
            Write-Error "Selbsttest gescheitert ($($p.ExitCode))"
            exit 1
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: selbsttest-windows
          path: |
            desktop/windows/selbsttest/*.png
            desktop/windows/selbsttest/*.txt
            desktop/windows/selbsttest/*.log
          if-no-files-found: ignore
          retention-days: 7

      # Der Bootstrapper von Microsoft (gut 1 MB) holt WebView2 nach, falls
      # es fehlt. Er muss von Microsoft unterschrieben sein — sonst nicht.
      - name: WebView2-Bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile installer\MicrosoftEdgeWebview2Setup.exe
          $s = Get-AuthenticodeSignature installer\MicrosoftEdgeWebview2Setup.exe
          if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            Write-Error "Unterschrift des Bootstrappers ungültig: $($s.Status) $($s.SignerCertificate.Subject)"
            exit 1
          }
          (Get-Item installer\MicrosoftEdgeWebview2Setup.exe).Length

      - name: NSIS
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path $nsis)) { Write-Error "makensis fehlt"; exit 1 }
          "NSIS=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Installer
        shell: pwsh
        working-directory: desktop/windows/installer
        run: |
          & $env:NSIS /V3 "/DVERSION=$env:ZAHL" "/DEXE=..\dist\Lumen.exe" "/DAUSGABE=..\dist\$env:DATEI" `
            "/DWEBVIEW2_SETUP=MicrosoftEdgeWebview2Setup.exe" "/DLIBMPV=..\dist\libmpv-2.dll" "/DDOKU=..\..\.." lumen.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "..\dist\$env:DATEI" | Format-List Name, Length
          $mb = [math]::Round((Get-Item "..\dist\$env:DATEI").Length / 1MB, 1)
          $dll = [math]::Round((Get-Item "..\dist\libmpv-2.dll").Length / 1MB, 1)
          "Installer: $mb MB (libmpv-2.dll ausgepackt: $dll MB)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # Einmal still installieren und wieder entfernen: Liegen Programm,
      # Startmenü-Eintrag und Deinstallation da, wo sie sollen?
      - name: Installer ausprobieren
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\$env:DATEI" -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "Installer: $($p.ExitCode)"; exit 1 }
          $ziel = "$env:LOCALAPPDATA\Programs\Lumen"
          foreach ($d in "$ziel\Lumen.exe", "$ziel\libmpv-2.dll", "$ziel\Deinstallieren.exe", "$ziel\LICENSE.txt", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Lumen.lnk") {
            if (-not (Test-Path $d)) { Write-Error "fehlt: $d"; exit 1 }
          }
          $reg = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Lumen'
          "$($reg.DisplayName) $($reg.DisplayVersion)"
          & "$ziel\Lumen.exe" --version | Out-Host
          # Der Deinstaller kopiert sich nach %TEMP% und kehrt sofort zurück.
          Start-Process -FilePath "$ziel\Deinstallieren.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$ziel\Lumen.exe"); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path "$ziel\Lumen.exe") { Write-Error "Deinstallation liess Lumen.exe zurück"; exit 1 }
          if (Test-Path "$ziel\libmpv-2.dll") { Write-Error "Deinstallation liess libmpv-2.dll zurück"; exit 1 }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Lumen.lnk") { Write-Error "Startmenü-Eintrag blieb"; exit 1 }
          "Installieren und Entfernen in Ordnung."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lumen-windows-app
          path: desktop/windows/dist/${{ env.DATEI }}
          if-no-files-found: error
          retention-days: 7
