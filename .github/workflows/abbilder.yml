# Die Docker-Abbilder bauen und ablegen.
#
# Ein eigener Ablauf, nicht Teil der Veröffentlichung: wenn an einem
# Abbild etwas klemmt, soll man es neu bauen können, ohne den ganzen
# Veröffentlichungslauf samt sechs Plattformen und zwei Mac-Maschinen
# zu wiederholen. Genau das war der Fall, als das Abbild des Vermittlers
# an einer Datei scheiterte, die es im Bau-Abbild gar nicht gab.

name: Abbilder

on:
  push:
    tags: ['v*']
  # Von Hand: ein Abbild zu einer bestehenden Fassung neu bauen, etwa wenn
  # es beim ersten Mal klemmte. Gebaut wird dann der Stand des Tags, nicht
  # der Zweig, von dem aus man startet.
  workflow_dispatch:
    inputs:
      version:
        description: 'Fassung, etwa v0.1.0 (der Tag muss existieren)'
        required: true

permissions:
  contents: read

jobs:
  # Zuerst die Tests. Vorher baute dieser Ablauf bei jedem v*-Tag ungeprüft
  # und schob :latest — ein Stand mit rotem Test landete so trotzdem auf
  # jedem NAS, das nachts Watchtower laufen lässt.
  pruefen:
    name: Fassung und Tests
    runs-on: ubuntu-latest
    outputs:
      mit: ${{ steps.v.outputs.mit }}
      ohne: ${{ steps.v.outputs.ohne }}
      ref: ${{ steps.v.outputs.ref }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      # Die Fassung mit und ohne „v". Gesucht wird oft beides: auf GitHub
      # heisst die Veröffentlichung v0.1.3, in einer docker-compose.yml
      # schreibt man gern 0.1.3. Vorher gab es nur die eine Schreibweise,
      # und wer die andere nahm, bekam „manifest unknown".
      #
      # Die Eingabe kommt nur über die Umgebung ins Skript, nie als
      # Ausdruck direkt in den Text, und muss genau so aussehen: v1.2.3.
      - name: Fassung
        id: v
        env:
          EINGABE: ${{ inputs.version }}
          EREIGNIS: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EREIGNIS" = "workflow_dispatch" ]; then V="$EINGABE"; else V="$REF_NAME"; fi
          if ! printf '%s' "$V" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Die Fassung muss so aussehen: v1.2.3 (bekommen: $V)"
            exit 1
          fi
          echo "mit=$V" >> "$GITHUB_OUTPUT"
          echo "ohne=${V#v}" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$V" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.v.outputs.ref }}
          fetch-depth: 0

      # :latest bekommt nur eine echte Veröffentlichung, und nur die
      # neueste. Ein nachgeschobener alter Tag oder ein Neubau einer alten
      # Fassung soll nicht jedes NAS nachts auf den alten Stand setzen.
      # Es zählt nur, was auf GitHub als Veröffentlichung
      # steht (kein Entwurf, keine Vorabfassung).
      - name: Gilt als latest?
        id: latest
        env:
          V: ${{ steps.v.outputs.mit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          neueste=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          latest=ja
          if [ "$V" != "$neueste" ]; then
            echo "$V ist nicht die neueste Fassung ($neueste) — kein :latest."
            latest=
          else
            # Auch beim Tag-Weg: ohne fertige Veröffentlichung kein :latest —
            # sonst zöge jede NAS mit automatischen Updates eine Fassung,
            # deren Veröffentlichung gescheitert ist.
            art=$(gh release view "$V" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
                    --jq 'if .isDraft or .isPrerelease then "vorab" else "echt" end' 2>/dev/null || echo fehlt)
            if [ "$art" != "echt" ]; then
              echo "Zu $V gibt es keine fertige Veröffentlichung ($art) — kein :latest."
              latest=
            fi
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: '1.25' }
      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Tests
        working-directory: server
        run: go test -mod=vendor ./...

  abbilder:
    name: Docker-Abbilder
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nur für den Kommentar mit dem Protokoll bei einem Fehlschlag
      packages: write   # Abbilder nach ghcr.io schieben
    env:
      MIT: ${{ needs.pruefen.outputs.mit }}
      OHNE: ${{ needs.pruefen.outputs.ohne }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.pruefen.outputs.ref }}

      # Bevor irgendetwas veröffentlicht wird: das Abbild wirklich starten.
      # So, wie es bei den Leuten läuft — mit einem benannten Volume, und
      # mit einem Ordner, der jemand anderem gehört, wie auf einem NAS.
      # Vorher wurde das Abbild nur gebaut, nie gestartet; dass Lumen darin
      # seine Datenbank nicht anlegen durfte, fiel niemandem auf.
      - name: Probelauf
        run: |
          set -u
          docker build -f server/Dockerfile -t lumen-probe \
            --build-arg "VERSION=$OHNE" . > probe.log 2>&1 || { cat probe.log; exit 1; }

          warte() {
            for i in $(seq 1 40); do
              curl -fsS "http://127.0.0.1:$1/api/v1/hello" > /dev/null && return 0
              sleep 1
            done
            return 1
          }
          fehler() {
            { echo "## Probelauf: $1"; echo; echo '```';
              for c in p1 p2 p3 r1; do echo "--- $c"; docker logs "$c" 2>&1 | tail -40; done
              echo '```'; } | tee -a probe.log > kommentar.md
            exit 1
          }

          # 1) Benanntes Volume, ohne weitere Angaben.
          docker run -d --name p1 -v probe-daten:/data -p 18096:8097 lumen-probe
          warte 18096 || fehler "benanntes Volume"

          # 2) Ein Ordner, der root gehört — Lumen soll als 1026:100 laufen,
          #    wie ein Benutzer auf einem Synology.
          mkdir -p "$RUNNER_TEMP/d2" && sudo chown 0:0 "$RUNNER_TEMP/d2"
          docker run -d --name p2 -e PUID=1026 -e PGID=100 \
            -v "$RUNNER_TEMP/d2:/data" -p 18097:8097 lumen-probe
          warte 18097 || fehler "fremder Ordner mit PUID/PGID"
          UID_LUMEN=$(docker exec p2 awk '/^Uid:/ { print $2 }' /proc/1/status)
          [ "$UID_LUMEN" = "1026" ] || fehler "Lumen läuft als $UID_LUMEN statt 1026"
          [ "$(stat -c %u "$RUNNER_TEMP/d2/lumen.db")" = "1026" ] || fehler "Datenbank gehört nicht 1026"

          # 3) Neustart mit denselben Daten — die Datenbank muss bleiben.
          docker restart p1 > /dev/null
          warte 18096 || fehler "Neustart"
          curl -fsS http://127.0.0.1:18096/api/v1/hello | grep -q '"setUp":false' || true

          # 4) Wer selbst einen Benutzer vorgibt, bekommt genau den.
          mkdir -p "$RUNNER_TEMP/d3" && sudo chown 1000:1000 "$RUNNER_TEMP/d3"
          docker run -d --name p3 --user 1000:1000 -v "$RUNNER_TEMP/d3:/data" -p 18098:8097 lumen-probe
          warte 18098 || fehler "mit --user"

          # 5) Der Vermittler: er muss sein Zertifikat ablegen dürfen.
          docker build -f server/Dockerfile.relay -t relay-probe . >> probe.log 2>&1 || fehler "Vermittler bauen"
          docker run -d --name r1 -e LUMEN_RELAY_SECRET=probe-geheimnis-probe-geheimnis \
            -v relay-daten:/daten relay-probe
          sleep 5
          [ "$(docker inspect -f '{{.State.Running}}' r1)" = "true" ] || { docker logs r1 >> probe.log 2>&1; fehler "Vermittler läuft nicht"; }

          echo "Alle Probeläufe bestanden."

      - name: "Bei Fehlschlag — das Protokoll als Kommentar"
        if: failure()
        run: |
          [ -s kommentar.md ] || { echo "## Abbilder"; echo; echo '```'; tail -c 30000 probe.log 2>/dev/null; echo '```'; } > kommentar.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="$(cat kommentar.md)" --silent || true
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lumen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          # Vom Wurzelverzeichnis aus, damit LICENSE mit ins Abbild kommt.
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.pruefen.outputs.ohne }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.pruefen.outputs.mit }}
            ghcr.io/${{ github.repository }}:${{ needs.pruefen.outputs.ohne }}
            ${{ needs.pruefen.outputs.latest == 'ja' && format('ghcr.io/{0}:latest', github.repository) || '' }}

      # Der Vermittler als eigenes, winziges Abbild: kein Betriebssystem,
      # kein FFmpeg, keine Datenbank. Er reicht Bytes durch.
      - name: Vermittler
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: server/Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.pruefen.outputs.ohne }}
          tags: |
            ghcr.io/${{ github.repository }}-relay:${{ needs.pruefen.outputs.mit }}
            ghcr.io/${{ github.repository }}-relay:${{ needs.pruefen.outputs.ohne }}
            ${{ needs.pruefen.outputs.latest == 'ja' && format('ghcr.io/{0}-relay:latest', github.repository) || '' }}
