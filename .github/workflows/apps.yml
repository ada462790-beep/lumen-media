# Die Apps wirklich übersetzen.
#
# Für Android braucht es das Android-SDK, für Apple einen Mac mit Xcode.
# Beides steht auf den Maschinen von GitHub bereit — man braucht also weder
# das eine installiert noch das andere besessen. Ein `git push` genügt, und
# ein paar Minuten später steht im Protokoll, ob es übersetzt.
#
# Das ist der Grund, warum diese Datei existiert: der Rest von Lumen lässt
# sich überall bauen, die vier App-Oberflächen nicht.
#
# Was hier entsteht:
#   lumen-handy.apk      zum Draufschieben aufs Handy
#   lumen-fernseher.apk  für Android TV und Fire TV
#   Apple: nur übersetzt, nicht verpackt — eine .ipa braucht ein
#          Entwicklerkonto und eine Signatur, und die gehören dir, nicht
#          diesem Ablauf.

name: Apps übersetzen

# Die Bau-Jobs führen Gradle und Xcode mit dem Code aus dem Stand aus —
# auch bei einem Pull-Request. Darum dürfen sie nur lesen. Schreiben (einen
# Kommentar an den Stand hängen) darf allein der kleine Job „kommentieren"
# am Ende, der keinen Code aus dem Repository ausführt und bei
# Pull-Requests gar nicht läuft.
permissions:
  contents: read

on:
  # Nur main und Pull-Requests, und nur, wenn sich an den Apps etwas
  # ändert: Ein Mac-Lauf dauert, und GitHub hat nicht beliebig viele Macs
  # frei. Pull-Requests aus Forks laufen genauso — nur mit Leserechten und
  # ohne Geheimnisse (die braucht hier kein Schritt).
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'apple/**'
      - '.github/workflows/apps.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'apple/**'
      - '.github/workflows/apps.yml'
  workflow_dispatch:
    inputs:
      mac:
        description: 'Mac-Rechner (macos-latest oder macos-15-intel, wenn die arm64-Macs bei GitHub ausgelastet sind)'
        type: choice
        options: [macos-latest, macos-15-intel]
        default: macos-latest

jobs:

  # ---------------------------------------------------------------- Android

  android:
    name: Android — Handy und Fernseher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # Das Android-SDK liegt auf ubuntu-latest bereits im Abbild. Hier
      # stand erst android-actions/setup-android@v3 — die Aktion ist
      # zweimal ohne Begründung gescheitert, und eine Fremdaktion sagt
      # einem nicht, warum. Ein eigener Schritt tut es auch und schreibt
      # mit, was er tut.
      - name: Android-SDK
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(keine platforms)"
            ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(keine build-tools)"
          } 2>&1 | tee -a bau.log
          test -n "$ANDROID_HOME" || { echo "Kein Android-SDK im Abbild." | tee -a bau.log; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          # Die Lizenzen sind im Abbild schon angenommen; schadet nicht,
          # es noch einmal zu bestätigen, und scheitert nicht daran.
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
            >/dev/null 2>&1 || true

      # Es gibt absichtlich keinen Gradle-Wrapper im Projekt: der besteht
      # aus einer JAR-Datei, und eine Binärdatei im Quelltext kann niemand
      # nachlesen. Stattdessen sagt dieser Ablauf, welche Gradle-Fassung er
      # benutzt — nachvollziehbar und ohne blinden Passagier.
      - name: Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'

      # Nicht `test`: lumen-core hat bewusst kein JUnit, und `gradle test`
      # liefe ohne eine einzige geprüfte Behauptung durch. `pruefen` startet
      # das Testprogramm wirklich.
      - name: lumen-core prüfen
        working-directory: android
        run: set -o pipefail; gradle :lumen-core:pruefen --no-daemon 2>&1 | tee -a ../bau.log

      - name: Handy und Tablet
        working-directory: android
        run: set -o pipefail; gradle :app:assembleDebug --no-daemon 2>&1 | tee -a ../bau.log

      - name: Android TV und Fire TV
        working-directory: android
        run: set -o pipefail; gradle :tv:assembleDebug --no-daemon 2>&1 | tee -a ../bau.log

      # Lint findet, was der Übersetzer durchgehen lässt: fehlende
      # Berechtigungen, Verweise ins Leere, Dinge, die auf alten Androiden
      # abstürzen. Es soll den Ablauf nicht scheitern lassen — der Bericht
      # liegt danach als Datei bereit.
      - name: Lint
        working-directory: android
        continue-on-error: true
        run: gradle :app:lintDebug :tv:lintDebug --no-daemon

      # Der Bericht landet sonst nur als Artefakt, und Artefakte liegen
      # hinter einer Adresse, an die aus der Entwicklungsumgebung niemand
      # herankommt. Für eine App, die noch nie auf einem Gerät lief, ist
      # Lint aber der nächstbeste Prüfer — also wird der Befund gelesen
      # und (über den Job „kommentieren") an den Stand gehängt, wenn etwas
      # drinsteht.
      - name: Lint-Befund berichten
        if: always()
        continue-on-error: true
        run: |
          mkdir -p berichte
          python3 - <<'PY' > lint.md
          import glob, xml.etree.ElementTree as ET

          # Lint schreibt denselben Fund mehrfach — einmal je Durchgang —
          # und meldet ausserdem jede Abhängigkeit, für die es eine neuere
          # Fassung gibt. Beim ersten Lauf waren das 46 von 64 Zeilen und
          # übertönten alles Echte. Also: doppelte weg, Fassungshinweise
          # in eine Zeile.
          VERALTET = {"GradleDependency", "AndroidGradlePluginVersion",
                      "NewerVersionAvailable"}

          gesehen, zeilen, alt = set(), [], set()
          for pfad in sorted(glob.glob("android/*/build/reports/lint-results-*.xml")):
              modul = pfad.split("/")[1]
              try:
                  wurzel = ET.parse(pfad).getroot()
              except ET.ParseError:
                  continue
              for fund in wurzel.findall("issue"):
                  schwere = fund.get("severity", "")
                  if schwere not in ("Error", "Fatal", "Warning"):
                      continue
                  regel = fund.get("id", "")
                  ort = fund.find("location")
                  wo = ort.get("file", "?").split("/")[-1] if ort is not None else "?"
                  nr = ort.get("line", "") if ort is not None else ""
                  nachricht = fund.get("message", "")
                  schluessel = (modul, regel, wo, nr, nachricht)
                  if schluessel in gesehen:
                      continue
                  gesehen.add(schluessel)
                  if regel in VERALTET:
                      alt.add(nachricht.split(" than ")[0].replace(
                          "A newer version of ", ""))
                      continue
                  zeilen.append(f"| {modul} | {schwere} | `{regel}` | "
                                f"{nachricht.replace('|', '\\\\|')[:160]} | "
                                f"{wo}{':' + nr if nr else ''} |")

          if zeilen or alt:
              print("## Lint\n")
          if zeilen:
              print(f"{len(zeilen)} Befund(e).\n")
              print("| Modul | Schwere | Regel | Was | Wo |")
              print("|---|---|---|---|---|")
              print("\n".join(zeilen[:60]))
              if len(zeilen) > 60:
                  print(f"\n… und {len(zeilen) - 60} weitere.")
          else:
              print("Nichts zu beanstanden.\n")
          if alt:
              wort = "Abhängigkeit gibt es eine neuere Fassung" if len(alt) == 1 \
                     else "Abhängigkeiten gibt es neuere Fassungen"
              print(f"\nFür {len(alt)} {wort}: " + ", ".join(sorted(alt)) + ".")
          PY
          if [ -s lint.md ]; then
            cat lint.md >> "$GITHUB_STEP_SUMMARY"
            cp lint.md berichte/android-lint.md
          else
            echo "Lint hat nichts zu beanstanden." >> "$GITHUB_STEP_SUMMARY"
          fi


      # Die Protokolle eines Laufs liegen bei GitHub hinter einer Adresse,
      # an die man von hier aus nicht herankommt. Die Zusammenfassung
      # dagegen steht in der Schnittstelle — also wandert das Ende des
      # Bauprotokolls dorthin, wenn etwas schiefgeht. Ohne das sieht man
      # nur „exit code 1" und rät.
      - name: "Bei Fehlschlag — das Protokoll in die Zusammenfassung"
        if: failure()
        run: |
          berichten() {
            {
              echo "## $1"
              echo
              echo '```'
              tail -c 50000 "$2" 2>/dev/null || echo "(kein Protokoll)"
              echo '```'
            }
          }
          berichten "Android — Bauprotokoll (Ende)" bau.log >> "$GITHUB_STEP_SUMMARY"
          # Die Zusammenfassung steht nur in der Schnittstelle fürs Auge.
          # Als Kommentar am Stand ist sie auch über die Schnittstelle
          # abrufbar — und darauf kommt es an, wenn jemand den Fehler
          # beheben soll, der nicht ins Protokoll schauen kann. Den
          # Kommentar schreibt der Job „kommentieren".
          mkdir -p berichte
          berichten "Android — Bauprotokoll (Ende)" bau.log > berichte/android-bau.md

      - name: Umbenennen
        run: |
          mkdir -p apks
          cp android/app/build/outputs/apk/debug/*.apk apks/lumen-handy.apk
          cp android/tv/build/outputs/apk/debug/*.apk apks/lumen-fernseher.apk
          ls -lh apks

      # Kurz aufbewahren: Der Artefakt-Speicher des Kontos ist schon
      # einmal voll gelaufen, und dann scheitert jeder weitere Lauf.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Ist der Artefakt-Speicher voll, soll das den Bau nicht rot machen.
        continue-on-error: true
        with:
          name: android-apks
          path: apks/*.apk
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Ist der Artefakt-Speicher voll, soll das den Bau nicht rot machen.
        continue-on-error: true
        if: always()
        with:
          name: android-lint
          path: android/*/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Ist der Artefakt-Speicher voll, soll das den Bau nicht rot machen.
        continue-on-error: true
        if: always()
        with:
          name: berichte-android
          path: berichte/*.md
          if-no-files-found: ignore
          retention-days: 3

  # ---------------------------------------------------------------- Apple

  apple:
    name: Apple — iPhone, iPad, Mac und Apple TV
    # Bei GitHub sind die arm64-Macs manchmal so ausgelastet, dass der Job
    # nach einer Viertelstunde ohne Rechner abbricht. Dann von Hand mit
    # mac=macos-15-intel starten.
    runs-on: ${{ inputs.mac == 'macos-15-intel' && 'macos-15-intel' || 'macos-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Xcode-Fassung zeigen
        run: xcodebuild -version

      # LumenKit zuerst: das ist der Teil ohne Oberfläche, und wenn dort
      # etwas nicht stimmt, lohnt sich der Rest nicht.
      - name: LumenKit prüfen
        working-directory: apple/LumenKit
        run: set -o pipefail; swift test 2>&1 | tee -a "$GITHUB_WORKSPACE/bau.log"

      - name: XcodeGen
        run: brew install xcodegen

      - name: Projekt erzeugen
        working-directory: apple
        run: xcodegen generate

      # Ohne Signatur und für den Simulator: so braucht dieser Ablauf weder
      # ein Entwicklerkonto noch ein Zertifikat. Übersetzt wird trotzdem
      # alles — und genau darum geht es hier.
      - name: iPhone und iPad
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet \
            2>&1 | tee -a "$GITHUB_WORKSPACE/bau.log"

      - name: Mac
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet \
            2>&1 | tee -a "$GITHUB_WORKSPACE/bau.log"

      - name: Apple TV
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lumen.xcodeproj \
            -scheme LumenTV \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet \
            2>&1 | tee -a "$GITHUB_WORKSPACE/bau.log"

      - name: "Bei Fehlschlag — das Protokoll in die Zusammenfassung"
        if: failure()
        run: |
          berichten() {
            {
              echo "## Apple — Bauprotokoll (Ende)"
              echo
              echo '```'
              tail -c 50000 "$GITHUB_WORKSPACE/bau.log" 2>/dev/null || echo "(kein Protokoll)"
              echo '```'
            }
          }
          berichten >> "$GITHUB_STEP_SUMMARY"
          mkdir -p berichte
          berichten > berichte/apple-bau.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Ist der Artefakt-Speicher voll, soll das den Bau nicht rot machen.
        continue-on-error: true
        if: always()
        with:
          name: berichte-apple
          path: berichte/*.md
          if-no-files-found: ignore
          retention-days: 3

  # ---------------------------------------------------------------- Kommentar

  # Hängt Lint-Befund und Bauprotokoll als Kommentar an den Stand. Der
  # einzige Job mit Schreibrecht: Er führt nichts aus dem Repository aus,
  # liest nur die Berichte der Bau-Jobs und läuft nicht bei Pull-Requests.
  kommentieren:
    name: Befunde an den Stand hängen
    needs: [android, apple]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # Ein Kommentar ist Beigabe — scheitert er (etwa weil die Berichte
    # wegen vollem Artefakt-Speicher fehlen), bleibt der Bau trotzdem grün.
    continue-on-error: true
    permissions:
      contents: write   # Kommentar an einen Commit
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: berichte-*
          path: berichte
          merge-multiple: true
      - name: Kommentieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in berichte/*.md; do
            [ -s "$f" ] || continue
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
              -f body="$(cat "$f")" --silent || true
          done
