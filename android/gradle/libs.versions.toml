# Eine Stelle für alle Fassungsnummern.

[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
media3 = "1.5.1"
coil = "2.7.0"
tvFoundation = "1.0.0-alpha11"
tvMaterial = "1.0.0"
# 1.1.0 ist die erste stabile Fassung (vorher alpha06). Sie markiert die
# Schnittstelle als veraltet — ein Nachfolger fehlt noch; bis dahin bleibt sie.
security = "1.1.0"
desugar = "2.1.3"
junit = "4.13.2"
# Downloads im Hintergrund. 2.9.x: die letzte Reihe, die mit compileSdk 35
# und Kotlin 2.0 ohne Weiteres zusammengeht.
work = "2.9.1"
# Chromecast: das Cast-SDK von Google und der Knopf von AndroidX. Fassungen,
# die zu compileSdk 35 und AGP 8.7 passen (die neueren verlangen mehr).
castFramework = "21.5.0"
mediarouter = "1.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# collectAsStateWithLifecycle steckt hier drin, nicht in -ktx oder
# -viewmodel-compose. Heute kommt es womöglich über eine fremde Kette mit;
# darauf soll sich nichts verlassen.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }

# Abspielen. ExoPlayer kann HLS von Haus aus — und weil der Server die
# vollständige Abspielliste vorab ausliefert, funktioniert damit auch das
# Springen in einen Film, der gerade erst umgewandelt wird.
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
play-services-cast-framework = { group = "com.google.android.gms", name = "play-services-cast-framework", version.ref = "castFramework" }
androidx-mediarouter = { group = "androidx.mediarouter", name = "mediarouter", version.ref = "mediarouter" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Entzuckerung: bringt neuere JDK-Klassen auf ältere Androide. Stand als
# Zeichenkette in beiden Bauskripten — eine Fassungsnummer an zwei Stellen
# geht irgendwann auseinander.
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

# Das Token gehört verschlüsselt abgelegt, nicht in die Einstellungen.
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security" }

androidx-tv-foundation = { group = "androidx.tv", name = "tv-foundation", version.ref = "tvFoundation" }
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
