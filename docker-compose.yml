# Lumen zu Hause starten.
#
# Auf einem Synology (Container Manager), ganz ohne SSH — ausführlich in
# der README.md, Abschnitt „Synology Schritt für Schritt":
#
#   1. In der File Station den Ordner /volume1/docker/lumen/daten anlegen
#   2. Container Manager › Registry: ghcr.io mit einem GitHub-Token
#      eintragen (das Abbild ist privat, siehe unten bei „image")
#   3. Container Manager › Projekt › Erstellen: Pfad /volume1/docker/lumen,
#      „docker-compose.yml erstellen" und diesen Text einfügen
#   4. Unten bei „volumes" den Pfad zu deinen Filmen und bei PUID/PGID
#      deinen Benutzer prüfen, dann „Fertig"
#   5. Im Browser http://<adresse-des-nas>:8097 öffnen
#
# Anderswo (Linux, Unraid …): diese Datei in einen Ordner legen, die Pfade
# anpassen und dort „docker compose up -d".
#
# Beim ersten Start legst du dich als Besitzer an und sagst Lumen, wo die
# Filme liegen — über „Durchsuchen" findest du die Ordner, die unten bei
# „volumes" freigegeben sind.
#
# Schon eine Installation, die mit „lumen-daten:/data" läuft? Dann diese
# Datei NICHT einfach ersetzen — mit der neuen Vorgabe sähe Lumen einen
# leeren Datenordner und finge von vorn an. Die alte Datei behalten (sie
# bekommt Updates genauso) oder umziehen wie in der README.md unter
# „Sichern und Wiederherstellen" beschrieben.

services:
  lumen:
    # Das fertige Abbild. Statt „latest" geht auch eine feste Fassung,
    # etwa „0.1.4" oder „v0.1.4" — beide Schreibweisen gibt es.
    #
    # Das Abbild liegt (noch) privat auf ghcr.io. Ohne Anmeldung meldet
    # Docker „denied" oder „unauthorized". Nötig ist ein GitHub-Token
    # (classic) mit nur dem Bereich „read:packages" — eingetragen im
    # Container Manager unter Registry oder einmal per
    # „docker login ghcr.io". Siehe README.md.
    image: ghcr.io/ada462790-beep/lumen-media:latest
    # Bei jedem Start/Erstellen nachsehen, ob es ein neueres Abbild gibt.
    # Ohne das nimmt Docker (und der Container Manager auf dem NAS) das
    # alte, schon geladene „latest" weiter — auch wenn längst ein neues da
    # ist. Mit dieser Zeile reicht im Container Manager: Projekt ›
    # Aktion › Erstellen. Kein Löschen des Projekts mehr nötig; die Daten
    # liegen im Datenordner und bleiben.
    pull_policy: always
    # Oder selbst bauen, vom Wurzelverzeichnis aus (dann die Zeile oben
    # weglassen):
    # build:
    #   context: .
    #   dockerfile: server/Dockerfile
    container_name: lumen
    restart: unless-stopped
    # Für Watchtower (siehe unten), damit es nur Lumen aktualisiert:
    # labels:
    #   - com.centurylinklabs.watchtower.enable=true
    # Beim Herunterfahren Zeit lassen, damit die Datenbank sauber
    # geschlossen wird (Docker gibt sonst nur 10 Sekunden).
    stop_grace_period: 30s
    ports:
      # Nur im Heimnetz. Diesen Port NICHT im Router freigeben — für
      # unterwegs gibt es den Vermittler (siehe unten und README.md).
      - "8097:8097"
      # Der verschlüsselte Eingang (HTTPS), nur wenn LUMEN_TLS gesetzt ist
      # oder der Fernzugriff läuft. Für den Vermittler braucht es diese
      # Zeile nicht — nur, wenn Geräte im Heimnetz Lumen direkt über HTTPS
      # erreichen sollen (oder ein Reverse-Proxy auf HTTPS weiterleitet).
      # - "8920:8920"
    volumes:
      # Datenbank, Poster, Zwischenspeicher und die tägliche Sicherung
      # (Unterordner „sicherungen"). Ein gewöhnlicher Ordner auf dem NAS,
      # kein benanntes Volume: So siehst du ihn in der File Station und
      # kannst ihn mit Hyper Backup sichern. Den Ordner vorher anlegen —
      # fehlt er, startet Lumen absichtlich nicht (create_host_path: false),
      # statt mit einem leeren Ordner neu anzufangen.
      - type: bind
        source: /volume1/docker/lumen/daten
        target: /data
        bind:
          create_host_path: false
      # Bestehende Installationen mit benanntem Volume: diese Zeile statt
      # der oberen, und ganz unten „volumes: lumen-daten:" einkommentieren.
      # - lumen-daten:/data

      # Deine Filme und Serien. Ein Container sieht vom NAS nur, was hier
      # steht. Am einfachsten links und rechts derselbe Pfad — dann heisst
      # in Lumen jeder Ordner so wie in der Dateiverwaltung des NAS, und
      # beim „Durchsuchen" findest du alles dort, wo du es kennst.
      # Das :rw am Ende heisst „lesen und schreiben", und das ist gewollt:
      # Lumen führt Filme, die in Teilen vorliegen (Film a/b/c, CD1/CD2),
      # zu einer Datei zusammen, wenn du es in der Verwaltung auslöst. Die
      # Teile wandern dabei in einen Unterordner .lumen-teile — gelöscht
      # wird nichts. Sonst schreibt Lumen nichts in die Medienordner.
      - /volume1/video:/volume1/video:rw

    # Zwischendateien beim Umwandeln im Arbeitsspeicher statt auf der
    # Platte (zusammen mit LUMEN_UMWANDLUNG_DIR=/umwandlung unten). Schont
    # die Platten eines schwachen NAS; 2–4 GB je gleichzeitiger
    # Umwandlung einplanen, und nur, wenn das NAS so viel frei hat.
    # tmpfs:
    #   - /umwandlung:size=4g

    environment:
      # Deine Zeitzone — anpassen, etwa Europe/Berlin oder Europe/Vienna.
      # Danach richten sich das Update-Fenster und die nächtliche
      # Sicherung (nach 4:30 Uhr).
      - TZ=Europe/Zurich
      # Unter welchem Benutzer Lumen läuft. Er muss deine Filme lesen (und
      # zum Zusammenführen schreiben) dürfen. Auf einem Synology hat der
      # erste selbst angelegte Benutzer meist 1026, die Gruppe „users" 100.
      # Wie du deine Zahlen ohne SSH findest und was bei falschen Zahlen
      # passiert, steht in der README.md. Auf einem gewöhnlichen Linux ist
      # es meist 1000/1000. Lumen selbst läuft nie als root.
      - PUID=1026
      - PGID=100
      # Lumen hört im Container immer auf 8097; nach aussen legst du den
      # Port oben fest.
      - LUMEN_ADDR=:8097

      # Für ein schwaches NAS: höchstens so viele Umwandlungen gleichzeitig
      # (Vorgabe 2), und die Zwischendateien woanders hin — etwa in den
      # Arbeitsspeicher (dann unten „tmpfs" einkommentieren).
      # - LUMEN_MAX_UMWANDLUNGEN=1
      # - LUMEN_UMWANDLUNG_DIR=/umwandlung

      # Nur nötig, wenn du am Quelltext etwas änderst. Lumen steht unter der
      # AGPL: wer eine veränderte Fassung betreibt, muss den Leuten, die sie
      # benutzen, den Quelltext zugänglich machen. Trag hier ein, wo deine
      # Fassung liegt — Lumen zeigt die Adresse dann in den Einstellungen an.
      # - LUMEN_SOURCE_URL=https://git.example.org/meine-lumen-fassung

      # Damit die Verwaltung sagen kann, ob es eine neue Fassung gibt —
      # nur nötig, solange das Repository auf GitHub privat ist. (Ein
      # anderes Token als das für ghcr.io: es muss die Veröffentlichungen
      # lesen dürfen, siehe README.md.)
      # - LUMEN_GITHUB_TOKEN=github_pat_…

      # Zusätzlich verschlüsselt (HTTPS) auf 8920 hören — oben den Port
      # einkommentieren. LUMEN_TLS_NAME ist der Name oder die Adresse, unter
      # der Geräte das NAS erreichen; er kommt ins eigene Zertifikat.
      # - LUMEN_TLS=1
      # - LUMEN_TLS_NAME=192.168.1.20

      # Wer Lumen unter einem eigenen Namen erreicht (Reverse-Proxy des
      # Synology, eigene Domain, DDNS wie name.synology.me), trägt ihn
      # hier ein — sonst lehnt Lumen die Anmeldung ab (Schutz vor
      # DNS-Rebinding). Mehrere mit Komma.
      # - LUMEN_HOSTS=kino.example.com

      # Von unterwegs schauen, ohne im Router einen Port zu öffnen.
      # Dafür läuft auf einer Maschine mit öffentlicher Adresse der
      # Vermittler (lumen-relay, siehe README.md). Diese drei Zeilen
      # einkommentieren und ausfüllen:
      #
      # - LUMEN_RELAY=meinserver.example:8444
      # - LUMEN_RELAY_SECRET=das-gleiche-wie-beim-vermittler
      # - LUMEN_RELAY_FINGERPRINT=60:62:a4:...   # gibt der Vermittler aus
      #
      # Sobald LUMEN_RELAY gesetzt ist, schaltet Lumen die Verschlüsselung
      # von selbst ein — durch den Vermittler darf nichts im Klartext
      # laufen, sonst könnte er mitlesen, was jemand schaut.

    # Hardware-Beschleunigung beim Umwandeln: die Grafikeinheit (Intel/AMD,
    # VAAPI oder Quick Sync — so auch bei Synology) an Lumen durchreichen.
    # Lumen probiert beim Start selbst aus, was geht, und fällt sonst auf
    # Software zurück (Verwaltung → Umwandeln). Der Container muss in der
    # Gruppe sein, der /dev/dri/renderD128 gehört: Die Nummer zeigt
    # „ls -ln /dev/dri" (Synology meist 937 „videodriver", sonst „render").
    # Für NVIDIA statt devices: das NVIDIA Container Toolkit und
    # „gpus: all" (bzw. runtime: nvidia).
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "937"
    # environment (zusätzlich, nur wenn nötig):
    #   - LUMEN_HARDWARE=vaapi          # auto | aus | vaapi | qsv | nvenc
    #   - LUMEN_VAAPI_GERAET=/dev/dri/renderD128

  # Updates von selbst: Im Container kann sich Lumen nicht selbst
  # ersetzen. Das übernimmt Watchtower — es holt nachts das neue Abbild
  # und startet nur Lumen neu (dank des Labels unten nichts anderes).
  # Zum Einschalten diese Zeilen und bei „lumen" die zwei labels-Zeilen
  # einkommentieren. Läuft gerade eine Wiedergabe, bricht sie ab — darum
  # nachts um 4.
  #
  # Wichtig, solange das Abbild privat ist: Watchtower braucht eigene
  # Zugangsdaten für ghcr.io. Ohne sie scheitert das nächtliche Update
  # still — es steht nur im Protokoll von Watchtower. Zwei Wege:
  #   a) REPO_USER und REPO_PASS (GitHub-Name und Token mit
  #      „read:packages") unten einkommentieren, oder
  #   b) nach einem „docker login ghcr.io" die Datei config.json
  #      einhängen (auf einem Synology liegt sie nach dem Login als root
  #      unter /root/.docker/config.json).
  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: lumen-watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     # Weg b):
  #     # - /root/.docker/config.json:/config.json:ro
  #   environment:
  #     - TZ=Europe/Zurich
  #     - WATCHTOWER_SCHEDULE=0 0 4 * * *
  #     - WATCHTOWER_LABEL_ENABLE=true
  #     - WATCHTOWER_CLEANUP=true
  #     # Weg a):
  #     # - REPO_USER=dein-github-name
  #     # - REPO_PASS=ghp_…

# Nur für bestehende Installationen mit benanntem Volume (siehe oben):
# volumes:
#   lumen-daten:
